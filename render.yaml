services:
  - type: web
    name: calculadora-perfecta-print
    env: node
    plan: free
    buildCommand: pnpm install --prod --ignore-scripts
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: calculadora-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MASTER_USERNAME
        sync: false
      - key: MASTER_PASSWORD
        sync: false

databases:
  - name: calculadora-db
    plan: free
    databaseName: perfectaprint_calc
    user: perfectaprint_user
